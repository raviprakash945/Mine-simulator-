                ctx.translate(p.x, p.y + bob);
                if (p.facingLeft) ctx.scale(-1, 1);

                const skin = hurt ? '#ff6b6b' : '#e0a878';
                const suit = hurt ? '#ff4444' : '#d97a2b';
                const suitDark = hurt ? '#c22' : '#a85c1e';

                // legs
                ctx.fillStyle = '#3a2a1a';
                ctx.fillRect(-5, 3 + legSwing * 0.3, 4, 8);
                ctx.fillRect(1, 3 - legSwing * 0.3, 4, 8);

                // back arm (behind torso)
                ctx.fillStyle = suitDark;
                ctx.fillRect(-7, -3 + armSwing * 0.4, 3, 8);

                // torso (rounded)
                ctx.fillStyle = suit;
                ctx.beginPath();
                ctx.moveTo(-6, -6);
                ctx.lineTo(6, -6);
                ctx.quadraticCurveTo(8, -6, 8, -2);
                ctx.lineTo(8, 4);
                ctx.quadraticCurveTo(8, 6, 6, 6);
                ctx.lineTo(-6, 6);
                ctx.quadraticCurveTo(-8, 6, -8, 4);
                ctx.lineTo(-8, -2);
                ctx.quadraticCurveTo(-8, -6, -6, -6);
                ctx.fill();

                // front arm + pickaxe, swings opposite the back arm
                ctx.save();
                ctx.translate(7, -1 + armSwing * 0.4);
                ctx.rotate(p.mining ? Math.sin(Date.now() / 60) * 0.9 : 0.3);
                ctx.fillStyle = suit;
                ctx.fillRect(-2, 0, 4, 7);
                // pickaxe
                ctx.strokeStyle = '#8a8a8a';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(6, -9);
                ctx.stroke();
                ctx.fillStyle = '#777';
                ctx.beginPath();
                ctx.moveTo(6, -9);
                ctx.lineTo(11, -5);
                ctx.lineTo(9, -12);
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                // head
                ctx.fillStyle = skin;
                ctx.beginPath();
                ctx.arc(0, -9, 5.5, 0, Math.PI * 2);
                ctx.fill();

                // helmet
                ctx.fillStyle = '#c99a1f';
                ctx.beginPath();
                ctx.arc(0, -10.5, 5.8, Math.PI, 0);
                ctx.fill();
                ctx.fillRect(-5.8, -10.5, 11.6, 2);

                // helmet lamp - glows warmer/brighter the more torch energy
                // remains, and flickers like the main torch when critically low
                const lampFlicker = this.torch.energy < 15 ? (0.6 + Math.random() * 0.4) : 1;
                ctx.fillStyle = `rgba(255, 220, 120, ${0.9 * lampFlicker})`;
                ctx.beginPath();
                ctx.arc(0, -13, 1.8, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            renderLighting(camX, camY) {
                // BUGFIX: the previous version drew a near-opaque (0.98 alpha)
                // black rectangle over the *already-rendered* scene, then added a
                // warm glow on top with normal (source-over) blending. Because the
                // dark rectangle never actually reaches full opacity, ~2% of every
                // rock/wall color bled through uniformly across the whole map -
                // which is exactly the "everything is a faint grey blob everywhere"
                // look in the screenshot, and explicitly violates "do NOT simply
                // make the whole map visible with a dark transparent overlay."
                //
                // Fix: build the darkness on a separate offscreen canvas that
                // starts fully opaque, then use "destination-out" compositing to
                // genuinely erase (not just dim) a soft-edged circle around the
                // player. Anything outside that circle stays 100% hidden.
                const w = this.canvas.width, h = this.canvas.height;
                if (this.darknessCanvas.width !== w || this.darknessCanvas.height !== h) {
                    this.darknessCanvas.width = w;
                    this.darknessCanvas.height = h;
                }
                const dctx = this.darknessCtx;
                const lightX = this.player.x - camX;
                const lightY = this.player.y - camY;

                // Subtle flicker on the radius itself so the torch feels alive
                // (stronger flicker when energy is critically low).
                const flicker = this.torch.energy < 15
                    ? 0.7 + Math.random() * 0.35
                    : 0.95 + Math.random() * 0.08;
                const radius = Math.max(15, this.torch.radius * flicker);

                dctx.globalCompositeOperation = 'source-over';
                // CHANGE: was pure black (#000). A faded, dark yellowish-brown
                // reads as "cave dark" without going to flat black, per request -
                // it's still fully opaque so nothing outside the torch is
                // actually visible, just tinted instead of jet black.
                dctx.fillStyle = '#241a10';
                dctx.fillRect(0, 0, w, h);

                dctx.globalCompositeOperation = 'destination-out';
                const holeGradient = dctx.createRadialGradient(lightX, lightY, 0, lightX, lightY, radius);
                holeGradient.addColorStop(0, 'rgba(255,255,255,1)');
                holeGradient.addColorStop(0.7, 'rgba(255,255,255,0.9)');
                holeGradient.addColorStop(1, 'rgba(255,255,255,0)');
                dctx.fillStyle = holeGradient;
                dctx.beginPath();
                dctx.arc(lightX, lightY, radius, 0, Math.PI * 2);
                dctx.fill();
                dctx.globalCompositeOperation = 'source-over';

                this.ctx.drawImage(this.darknessCanvas, 0, 0);

                // Warm torch tint - clipped to the lit circle so it can never leak
                // color into the dark area outside the torch. Toned down from
                // the previous version, which stacked with the wall color to
                // look too bright/yellow overall.
                this.ctx.save();
                this.ctx.beginPath();
                this.ctx.arc(lightX, lightY, radius, 0, Math.PI * 2);
                this.ctx.clip();
                const tint = this.ctx.createRadialGradient(lightX, lightY, 0, lightX, lightY, radius);
                tint.addColorStop(0, 'rgba(255, 140, 40, 0.14)');
                tint.addColorStop(0.7, 'rgba(255, 80, 0, 0.05)');
                tint.addColorStop(1, 'rgba(0, 0, 0, 0)');
                this.ctx.fillStyle = tint;
                this.ctx.fillRect(lightX - radius, lightY - radius, radius * 2, radius * 2);
                this.ctx.restore();
            }

            renderMinimap() {
                const canvas = this.minimapCanvas;
                const ctx = this.minimapCtx;
                const tileSize = 20;

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = '#ff8800';
                ctx.lineWidth = 1;
                ctx.strokeRect(0, 0, canvas.width, canvas.height);

                const scale = Math.min(canvas.width, canvas.height) / Math.max(this.cave[0].length * tileSize, this.cave.length * tileSize);
                const mapScale = scale * tileSize;

                // BUGFIX: draw every tile the player has actually explored (fog of
                // war persists), instead of only the current light radius which
                // erased previously-seen areas as soon as the player moved on.
                for (let j = 0; j < this.explored.length; j++) {
                    for (let i = 0; i < this.explored[0].length; i++) {
                        if (this.explored[j][i]) {
                            ctx.fillStyle = this.cave[j][i] === 1 ? '#555' : 'rgba(150, 150, 150, 0.35)';
                            ctx.fillRect(i * mapScale, j * mapScale, mapScale + 0.5, mapScale + 0.5);
                        }
                    }
                }

                // Draw player
                ctx.fillStyle = '#ffaa00';
                ctx.fillRect(
                    (this.player.x * scale) - 2,
                    (this.player.y * scale) - 2,
                    4,
                    4
                );

                // BUGFIX: the exit used to always be visible on the minimap even
                // before discovery, contradicting "the exit can remain hidden until
                // the player discovers it". Only draw it once its tile is explored
                // AND the hidden finish line has actually been mined open.
                const exitI = Math.floor(this.exitPos.x / tileSize);
                const exitJ = Math.floor(this.exitPos.y / tileSize);
                if (this.exitRevealed && this.explored[exitJ] && this.explored[exitJ][exitI]) {
                    ctx.fillStyle = '#ff6600';
                    ctx.fillRect(
                        (this.exitPos.x * scale) - 2,
                        (this.exitPos.y * scale) - 2,
                        4,
                        4
                    );
                }
            }

            // ================================================================
            // UI MENUS
            // ================================================================

            showMainMenu() {
                this.gameState = 'menu';
                this.hideAllMenus();
                document.getElementById('mainMenu').classList.remove('hidden');
                this.updateSoundButton();
            }

            showLevelCompleteMenu() {
                const stats = this.levelStats;
                document.getElementById('levelStats').innerHTML = `
                    <div class="stats-item">⏱️ Time: ${stats.time}s</div>
                    <div class="stats-item">⛏️ Materials: ${stats.collected}</div>
                    <div class="stats-item">🔥 Torch: ${stats.torchRemaining}%</div>
                    <div class="stats-item" style="color: #ffaa00; margin-top: 10px;">Reward: +${stats.reward} currency</div>
                `;
                document.getElementById('levelCompleteMenu').classList.remove('hidden');
            }

            showUpgradesMenu() {
                this.gameState = 'menu';
                this.hideAllMenus();

                const upgradeList = [
                    {
                        id: 'torchRadius',
                        name: '🔆 Larger Light Radius',
                        desc: 'Increases torch light range',
                        cost: 100
                    },
                    {
                        id: 'torchDrain',
                        name: '🔋 Efficient Torch',
                        desc: 'Torch drains slower',
                        cost: 150
                    },
                    {
                        id: 'miningSpeed',
                        name: '⚡ Faster Mining',
                        desc: 'Mine rocks quicker',
                        cost: 120
                    },
                    {
                        id: 'playerHealth',
                        name: '❤️ More Health',
                        desc: 'Survive longer',
                        cost: 80
                    },
                    {
                        id: 'playerSpeed',
                        name: '🏃 Faster Movement',
                        desc: 'Move quicker through caves',
                        cost: 90
                    }
                ];

                let html = '';
                for (let upgrade of upgradeList) {
                    const level = this.upgrades[upgrade.id] || 0;
                    const cost = upgrade.cost + (level * 50);
                    const canAfford = this.currency >= cost;
                    html += `
                        <div class="upgrade-item">
                            <div class="upgrade-item-name">${upgrade.name} (${level})</div>
                            <div class="upgrade-item-desc">${upgrade.desc}</div>
                            <div class="upgrade-item-cost">Cost: ${cost}</div>
                            <button onclick="game.buyUpgrade('${upgrade.id}')" 
                                style="margin-top: 8px; width: 100%; ${!canAfford ? 'opacity: 0.5; cursor: not-allowed;' : ''}">
                                BUY
                            </button>
                        </div>
                    `;
                }

                document.getElementById('upgradesContainer').innerHTML = html;
                document.getElementById('currencyDisplay').textContent = this.currency;
                document.getElementById('upgradesMenu').classList.remove('hidden');
            }

            buyUpgrade(upgradeId) {
                const upgradeCosts = {
                    torchRadius: 100,
                    torchDrain: 150,
                    miningSpeed: 120,
                    playerHealth: 80,
                    playerSpeed: 90
                };

                const baseCost = upgradeCosts[upgradeId];
                const level = this.upgrades[upgradeId] || 0;
                const cost = baseCost + (level * 50);

                if (this.currency >= cost) {
                    this.currency -= cost;
                    this.upgrades[upgradeId] = (this.upgrades[upgradeId] || 0) + 1;
                    this.playSound(500, 0.2);
                    this.saveProgress();
                    this.showUpgradesMenu(); // Refresh menu
                }
            }

            showLevelsMenu() {
                this.gameState = 'menu';
                this.hideAllMenus();

                let html = '';
                for (let i = 1; i <= this.maxLevel; i++) {
                    html += `<button onclick="game.startLevel(${i})">LEVEL ${i}</button>`;
                }

                document.getElementById('levelsButtonContainer').innerHTML = html;
                document.getElementById('levelsMenu').classList.remove('hidden');
            }

            showSettingsMenu() {
                this.gameState = 'menu';
                this.hideAllMenus();
                document.getElementById('settingsMenu').classList.remove('hidden');
                this.updateSoundButton();
            }

            showPauseMenu() {
                document.getElementById('pauseMenu').classList.remove('hidden');
            }

            hidePauseMenu() {
                document.getElementById('pauseMenu').classList.add('hidden');
            }

            hideAllMenus() {
                document.getElementById('mainMenu').classList.add('hidden');
                document.getElementById('pauseMenu').classList.add('hidden');
                document.getElementById('levelCompleteMenu').classList.add('hidden');
                document.getElementById('gameOverMenu').classList.add('hidden');
                document.getElementById('levelsMenu').classList.add('hidden');
                document.getElementById('upgradesMenu').classList.add('hidden');
                document.getElementById('settingsMenu').classList.add('hidden');
            }

            togglePause() {
                if (this.gameState === 'playing') {
                    this.gameState = 'paused';
                    this.showPauseMenu();
                } else if (this.gameState === 'paused') {
                    this.gameState = 'playing';
                    this.hidePauseMenu();
                }
            }

            restartLevel() {
                this.inventory = { stone: 0, coal: 0, iron: 0, crystal: 0, rareCrystal: 0 };
                this.startLevel(this.currentLevel);
            }

            nextLevel() {
                if (this.currentLevel < this.maxLevel) {
                    this.currentLevel++;
                    this.inventory = { stone: 0, coal: 0, iron: 0, crystal: 0, rareCrystal: 0 };
                    this.startLevel(this.currentLevel);
                } else {
                    this.showMainMenu();
                }
            }

            returnToMenu() {
                this.showMainMenu();
            }

            toggleSound() {
                this.soundEnabled = !this.soundEnabled;
                localStorage.setItem('soundEnabled', this.soundEnabled);
                this.updateSoundButton();
            }

            updateSoundButton() {
                const btn = document.getElementById('soundToggle');
                if (btn) {
                    btn.textContent = this.soundEnabled ? '🔊 SOUND: ON' : '🔇 SOUND: OFF';
                }
            }

            resetAllProgress() {
                if (confirm('Are you sure? This will reset all progress and currency.')) {
                    this.currency = 0;
                    this.upgrades = {
                        torchRadius: 0,
                        torchDrain: 0,
                        miningSpeed: 0,
                        playerHealth: 0,
                        playerSpeed: 0
                    };
                    this.currentLevel = 1;
                    this.saveProgress();
                    this.showMainMenu();
                }
            }

            // ================================================================
            // SAVE/LOAD
            // ================================================================

            saveProgress() {
                const save = {
                    currency: this.currency,
                    upgrades: this.upgrades,
                    currentLevel: this.currentLevel,
                    soundEnabled: this.soundEnabled
                };
                localStorage.setItem('deepDarkSave', JSON.stringify(save));
            }

            loadProgress() {
                const save = localStorage.getItem('deepDarkSave');
                if (save) {
                    const data = JSON.parse(save);
                    this.currency = data.currency || 0;
                    this.upgrades = data.upgrades || this.upgrades;
                    this.currentLevel = data.currentLevel || 1;
                }
            }

            // ================================================================
            // MAIN LOOP
            // ================================================================

            gameLoop() {
                this.update();
                this.render();
                requestAnimationFrame(() => this.gameLoop());
            }

            start() {
                // Request landscape orientation on mobile
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(err => {
                        console.log('Orientation lock not available:', err);
                    });
                }

                // Handle orientation changes
                window.addEventListener('orientationchange', () => {
                    setTimeout(() => {
                        this.resizeCanvas();
                    }, 100);
                });

                this.gameLoop();
            }
        }

        // Initialize game
        const game = new Game();
        game.start();

        // Prevent scrolling
        document.addEventListener('wheel', (e) => {
            if (game.gameState === 'playing') {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
